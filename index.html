<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfbfc" />
    <!--
      SVG first for anything current; the 32px PNG is the fallback for browsers
      that don't take an SVG icon. apple-touch-icon is square and full-bleed on
      purpose — iOS applies its own rounded mask, so a pre-rounded icon is
      clipped twice. Paths are written with a leading slash and no %BASE_URL%:
      Vite prepends the base itself, and doing both double-prefixes it in dev.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Set here as the pre-mount default; App keeps it in step with the route. -->
    <title>Interview Field Guides</title>
    <meta name="description" content="Interview field guides and worked system designs, as a browsable library." />
    <!--
      Paint the right theme before the first frame. The app is a static SPA on
      GitHub Pages, so waiting for React to mount would flash the wrong colours
      on every load — long enough to notice on a phone.

      This duplicates resolve()/apply() from src/lib/theme.ts on purpose: nothing
      is importable this early. Keep the two in sync — theme.ts carries the same
      note pointing back here. Classic script, not a module, so Vite leaves it
      inline rather than deferring it into the bundle.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('morning-recall:theme')
          var choice = stored ? JSON.parse(stored) : 'system'
          var dark =
            choice === 'dark' ||
            (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0a0a0b' : '#fbfbfc')
        } catch (e) {
          /* private mode, storage disabled, ancient browser — fall through to light */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
